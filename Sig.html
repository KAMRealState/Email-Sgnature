<table cellpadding="0" cellspacing="0" border="0" style="font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td style="vertical-align:middle;padding-right:20px;">
      <img src="https://raw.githubusercontent.com/KAMRealState/Email-Sgnature/main/Logo-KAM.png" alt="KAM" width="180" style="display:block;border:0;">
    </td>
    <td style="vertical-align:middle;padding-left:20px;border-left:1px solid #000000;">
      <div style="font-size:20px;font-weight:bold;color:#000000;line-height:26px;"><span style="color:#000000;">{{ User Profile.Name }}</span></div>
      <div style="font-size:14px;color:#000000;line-height:20px;padding-top:2px;"><span style="color:#000000;">{{custom.Position}}</span></div>
      <table cellpadding="0" cellspacing="0" border="0" style="font-size:13px;line-height:20px;margin-top:8px;">
        <tr>
          <td style="padding:0 8px 0 0;white-space:nowrap;"><span style="color:#000000;font-weight:bold;">Phone</span></td>
          <td style="padding:0;"><span style="color:#000000;">{{ User Profile.Phone }}</span></td>
        </tr>
        <tr>
          <td style="padding:0 8px 0 0;white-space:nowrap;"><span style="color:#000000;font-weight:bold;">Email</span></td>
          <td style="padding:0;"><a href="mailto:{{ User Profile.Email Address }}" style="color:#000000;text-decoration:none;"><span style="color:#000000;text-decoration:none;">{{ User Profile.Email Address }}</span></a></td>
        </tr>
        <tr>
          <td style="padding:0 8px 0 0;white-space:nowrap;"><span style="color:#000000;font-weight:bold;">Web</span></td>
          <td style="padding:0;"><a href="https://www.kamrs.com" style="color:#000000;text-decoration:none;"><span style="color:#000000;text-decoration:none;">www.kamrs.com</span></a></td>
        </tr>
        <tr>
          <td style="padding:0 8px 0 0;white-space:nowrap;"><span style="color:#000000;font-weight:bold;">Location</span></td>
          <td style="padding:0;"><span style="color:#000000;">Riyadh, Saudi Arabia</span></td>
        </tr>
      </table>
    </td>
  </tr>
</table>
